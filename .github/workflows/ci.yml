name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: facturacion/package-lock.json

      - name: Install dependencies
        working-directory: facturacion
        run: npm ci

      - name: Run lint
        working-directory: facturacion
        run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: facturacion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: test_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a test_password ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: facturacion/package-lock.json

      - name: Install dependencies
        working-directory: facturacion
        run: npm ci

      - name: Run e2e tests
        working-directory: facturacion
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_NAME: facturacion_test
          REDIS_URL: redis://:test_password@localhost:6379
          JWT_SECRET: super_secret_key_for_testing_purposes_only
          NODE_ENV: test
        run: npm run test:e2e

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: facturacion
          push: false
          tags: facturacion-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image startup
        run: |
          docker run --rm facturacion-api:latest node -v
          # Nota: No arrancamos la app completa porque requiere DB/Redis para pasar el healthcheck
